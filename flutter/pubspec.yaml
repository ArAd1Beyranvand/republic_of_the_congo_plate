name: republic_of_the_congo_plate
description: "Republic of the Congo's licence plates for the plate_core library — the regular black-on-white plate with the CEMAC emblem, one theme, Latin alphabets and an advisory validator."
version: 0.1.0
repository: https://github.com/ArAd1Beyranvand/republic_of_the_congo_plate/tree/main/flutter
resolution: workspace

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.12.0
  plate_alphabet: ^0.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/cemac_emblem.png
